name: cpp-port

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Pico SDK build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi

      - name: Build host-side tests
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          cmake -S cpp_port -B cpp_port/build-tests -DENABLE_TESTS=ON
          cmake --build cpp_port/build-tests -j2
          ctest --test-dir cpp_port/build-tests --output-on-failure

      - name: Build firmware for all supported models
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          cmake -S cpp_port -B cpp_port/build-keylab -DEMULATED_MODEL=KEYLAB_ESSENTIAL_61
          cmake --build cpp_port/build-keylab -j2
          cmake -S cpp_port -B cpp_port/build-mk3 -DEMULATED_MODEL=KEYLAB_ESSENTIAL_MK3
          cmake --build cpp_port/build-mk3 -j2
          cmake -S cpp_port -B cpp_port/build-minilab -DEMULATED_MODEL=MINILAB3
          cmake --build cpp_port/build-minilab -j2

      - name: Upload UF2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mock-arturia-controller-uf2
          path: |
            cpp_port/build-keylab/mock_arturia_controller_cpp.uf2
            cpp_port/build-mk3/mock_arturia_controller_cpp.uf2
            cpp_port/build-minilab/mock_arturia_controller_cpp.uf2

      - name: Publish UF2 files to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Release ${GITHUB_REF_NAME}" \
            --notes "Built UF2 firmware artifacts for ${GITHUB_REF_NAME}." \
            cpp_port/build-keylab/mock_arturia_controller_cpp.uf2 \
            cpp_port/build-mk3/mock_arturia_controller_cpp.uf2 \
            cpp_port/build-minilab/mock_arturia_controller_cpp.uf2 \
            || gh release upload "${GITHUB_REF_NAME}" \
              cpp_port/build-keylab/mock_arturia_controller_cpp.uf2 \
              cpp_port/build-mk3/mock_arturia_controller_cpp.uf2 \
              cpp_port/build-minilab/mock_arturia_controller_cpp.uf2 \
              --clobber
