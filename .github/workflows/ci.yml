name: CI

on:
  push:
  pull_request:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check Python syntax
        run: |
          python3 -m py_compile boot.py
          python3 -m py_compile code.py
          echo "Syntax OK"
